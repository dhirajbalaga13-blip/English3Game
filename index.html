<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>⚡ HONORS GAUNTLET: LITERARY ARENA ⚡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, #0b0e1a, #010101);
            font-family: 'Orbitron', 'Poppins', 'Segoe UI', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* MAIN GAME PANEL */
        .game-container {
            max-width: 1350px;
            width: 100%;
            background: rgba(0, 5, 15, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            border: 2px solid #0ff8;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3), inset 0 0 20px rgba(0, 255, 255, 0.05);
            padding: 1.5rem;
            transition: all 0.2s;
        }

        /* MODE SELECTOR */
        .mode-arena {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .mode-btn {
            background: #111c2c;
            border: 1px solid cyan;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: bold;
            font-family: monospace;
            color: #bbf5ff;
            cursor: pointer;
            transition: 0.1s linear;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .mode-btn.active {
            background: cyan;
            color: #000;
            box-shadow: 0 0 15px cyan;
            border-color: white;
        }
        .mode-btn:hover {
            transform: scale(0.96);
            background: #2f5f8f;
        }

        /* STATS PANEL */
        .stats-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: #030c1ae0;
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            margin-bottom: 20px;
            border: 1px solid #0ff;
        }
        .stat {
            background: #00000099;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            color: #e0f2fe;
        }
        .score { color: #f5cb5c; font-size: 1.8rem; font-weight: 900; }
        .lives { color: #ff7b72; font-size: 1.5rem; }
        .powerup-badge {
            background: #2a0f3b;
            padding: 5px 12px;
            border-radius: 30px;
            gap: 15px;
        }
        .powerup-btn {
            background: #3f2b4e;
            border: none;
            color: gold;
            padding: 5px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.05s linear;
        }
        .powerup-btn:active { transform: scale(0.95);}
        .timer-zone {
            margin: 15px 0 12px;
            height: 14px;
            background: #1e2a3a;
            border-radius: 20px;
            overflow: hidden;
        }
        .timer-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #0ff, #f0f);
            transition: width 0.03s linear;
        }
        .question-card {
            background: rgba(8, 18, 32, 0.9);
            border-radius: 2rem;
            padding: 1.5rem;
            margin: 15px 0;
            border-left: 8px solid cyan;
        }
        .passage-box {
            background: #071b2b;
            padding: 1rem;
            border-radius: 1rem;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            margin-bottom: 1.2rem;
            border-left: 4px solid #ffaa44;
            font-style: italic;
        }
        .question-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff5e0;
            margin-bottom: 1.4rem;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 16px;
            margin: 20px 0;
        }
        .option-btn {
            background: #0a1428;
            border: 2px solid #2c6c9e;
            padding: 12px 12px;
            border-radius: 70px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #eef4ff;
            cursor: pointer;
            transition: 0.07s linear;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .option-btn:hover:not(:disabled) {
            background: #1f4970;
            border-color: cyan;
            transform: scale(0.97);
        }
        .correct-flash {
            background: #00a86b !important;
            border-color: gold !important;
            animation: pulseGreen 0.2s ease;
        }
        .wrong-shake {
            animation: shake 0.2s ease-in-out 0s 2;
            background: #aa2e2e;
        }
        @keyframes shake {
            0% { transform: translateX(0);}
            25% { transform: translateX(-6px);}
            75% { transform: translateX(6px);}
            100% { transform: translateX(0);}
        }
        @keyframes pulseGreen {
            0% { box-shadow: 0 0 0 0 #0f0; }
            100% { box-shadow: 0 0 0 8px transparent; }
        }
        .next-area {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .next-btn, .restart-btn {
            background: linear-gradient(145deg, #1f3f5f, #071a2a);
            border: 1px solid cyan;
            padding: 10px 28px;
            font-weight: bold;
            border-radius: 40px;
            color: cyan;
            cursor: pointer;
        }
        .restart-btn {
            background: #2f1e2e;
            color: #ffaa88;
        }
        .footer-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            gap: 15px;
        }
        .particle {
            position: fixed;
            pointer-events: none;
            background: radial-gradient(circle, gold, orange);
            border-radius: 50%;
            animation: particlePop 0.6s forwards;
            z-index: 999;
        }
        @keyframes particlePop {
            0% { transform: scale(0.2) translateY(0); opacity: 1;}
            100% { transform: scale(1.2) translateY(-60px); opacity: 0;}
        }
        @media (max-width: 700px) {
            .question-text { font-size: 1.2rem; }
            .stats-panel { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="game-container" id="gameRoot">
    <div class="mode-arena" id="modeSelector">
        <button data-mode="classic" class="mode-btn active">🎮 CLASSIC (timed/lives)</button>
        <button data-mode="endurance" class="mode-btn">🧘 ENDURANCE (no timer, more lives)</button>
        <button data-mode="blitz" class="mode-btn">⚡ BLITZ (10s, double points)</button>
    </div>
    <div class="stats-panel">
        <div class="stat">🏆 SCORE <span class="score" id="scoreValue">0</span></div>
        <div class="stat">❤️ LIVES <span class="lives" id="livesValue">3</span></div>
        <div class="stat">🔥 STREAK <span id="streakValue">0</span></div>
        <div class="stat">📖 Q<span id="qIndex">0</span>/<span id="qTotal">0</span></div>
        <div class="powerup-badge">✨ POWER-UPS <button id="hintBtn" class="powerup-btn">💡 HINT (<span id="hintCount">2</span>)</button>
        <button id="skipBtn" class="powerup-btn">⏩ SKIP (<span id="skipCount">1</span>)</button></div>
    </div>
    <div class="timer-zone" id="timerZone"><div class="timer-fill" id="timerFill" style="width: 100%"></div></div>
    <div id="questionContainer" class="question-card">
        <div id="passageDisplay" class="passage-box" style="display: none;"></div>
        <div id="questionText" class="question-text">⚔️ Choose your mode & conquer the literary gauntlet ⚔️</div>
        <div id="optionsArea" class="options-grid"></div>
        <div id="feedbackMsg" style="font-size: 0.9rem; margin-top: 8px; padding: 8px; text-align: center;"></div>
        <div class="next-area" id="nextButtonArea" style="display: none;"><button class="next-btn" id="nextBtn">➡️ NEXT TRIAL</button></div>
    </div>
    <div class="footer-controls"><button class="restart-btn" id="restartGameBtn">🔄 RESTART GAUNTLET</button></div>
</div>

<script>
    // ---------- MASSIVE QUESTION BANK (FULL HONORS ENGLISH III) ----------
    const MASTER_QUESTIONS = [];
    function addQ(question, options, correctIdx, passage = null, explanation = "") {
        MASTER_QUESTIONS.push({ question, options, correctIdx, passage, explanation });
    }
    // MAJOR WORKS & PERIODS
    addQ("In 'The Crucible', who leads the accusations while having an affair with John Proctor?", ["Abigail Williams", "Elizabeth Proctor", "Mary Warren", "Rebecca Nurse"], 0, null, "Abigail manipulates Salem.");
    addQ("Symbol in 'Gatsby' representing hopes & Daisy?", ["Green light", "Valley of ashes", "East Egg", "T.J. Eckleburg"], 0, null, "Green light at Daisy's dock.");
    addQ("Chris McCandless' alias in 'Into the Wild':", ["Alexander Supertramp", "Jim Gallien", "Wayne Westerberg", "Krakauer"], 0, null, "Alexander Supertramp.");
    addQ("Who dreams of becoming a doctor in 'Raisin in the Sun'?", ["Beneatha Younger", "Walter Lee", "Lena", "Ruth"], 0, null, "Beneatha wants to be a physician.");
    addQ("Which period emphasizes emotion, nature, individualism?", ["Romanticism", "Realism", "Modernism", "Puritanism"], 0, null, "Romanticism (1800–1860).");
    addQ("Literary period focusing on ordinary life & dialect?", ["Realism", "Romanticism", "Colonial", "Modernism"], 0, null, "Realism depicts everyday reality.");
    addQ("Famous Puritan poet?", ["Anne Bradstreet", "Walt Whitman", "Emily Dickinson", "Edgar Allan Poe"], 0, null, "Anne Bradstreet, colonial poet.");
    // POETRY
    addQ("In 'Because I could not stop for Death', Death is personified as?", ["Carriage driver", "Kind suitor", "King", "Ghost"], 1, null, "He kindly stopped for me.");
    addQ("'Crumbling is not an instant’s Act' suggests?", ["Decay is gradual", "Sudden collapse", "Hope remains", "Nature's fury"], 0, null, "Gradual process of decline.");
    addQ("'My life closed twice before its close' theme?", ["Loss & parting", "Joy", "Immortality", "Nature"], 0, null, "Losses that feel like death.");
    addQ("In 'The Raven', the raven perches upon a bust of?", ["Pallas", "Apollo", "Zeus", "Athena"], 0, null, "Pallas Athena, wisdom.");
    addQ("'Song of Myself' celebrates?", ["Individuality & self", "Despair", "War", "Urban life"], 0, null, "Whitman's celebration of self.");
    addQ("'Hope is the thing with feathers' compares hope to a?", ["Bird", "Butterfly", "Star", "Tree"], 0, null, "A bird that perches.");
    // SHORT STORIES
    addQ("In 'Masque of the Red Death', the clock chime symbolizes?", ["Inevitability of death", "Celebration", "Wealth", "Illusion"], 0, null, "Time running out.");
    addQ("Narrator in 'The Yellow Wallpaper' suffers from?", ["Postpartum depression", "Consumption", "Amnesia", "PTSD"], 0, null, "Rest cure & oppression.");
    addQ("'To Build a Fire' main cause of death?", ["Pride & underrating nature", "Wolves", "Falling ice", "Matches"], 0, null, "Arrogance against the wild.");
    // TRANSCENDENTALISM
    addQ("Emerson's 'Self-Reliance' urges:", ["Trust thyself", "Follow tradition", "Conformity", "Reject intuition"], 0, null, "Nonconformity & inner voice.");
    addQ("Thoreau's 'Civil Disobedience' advocates:", ["Disobey unjust laws", "Always obey", "Pay all taxes", "Violent revolt"], 0, null, "Passive resistance.");
    // FINAL UNIT
    addQ("'Born of Man and Woman' perspective:", ["A monstrous child", "A mother", "Scientist", "Alien"], 0, null, "Imprisoned creature.");
    addQ("In 'Story of an Hour', Louise Mallard feels:", ["Liberation", "Grief", "Indifference", "Panic"], 0, null, "Freedom and independence.");
    addQ("'A Rose for Emily' discovery:", ["Homer Barron's corpse", "Treasure", "Secret marriage", "Poison"], 0, null, "Skeleton in the bed.");
    addQ("'Mirror Image' theme:", ["Identity & memory", "Alien invasion", "Revolution", "Poverty"], 0, null, "Brain transplant identity crisis.");
    addQ("'Standard Loneliness Package' allows people to:", ["Outsource emotions", "Fly", "Telepathy", "Immortality"], 0, null, "Hire others to feel pain.");
    // TERMS
    addQ("Hint of future events:", ["Foreshadowing", "Flashback", "Irony", "Allusion"], 0, null, "Foreshadowing builds suspense.");
    addQ("'The wind whispered' is:", ["Personification", "Simile", "Metaphor", "Alliteration"], 0, null, "Human traits to nature.");
    addQ("Character who changes internally:", ["Dynamic", "Static", "Flat", "Stock"], 0, null, "Dynamic character evolves.");
    addQ("Author's attitude toward subject:", ["Tone", "Mood", "Theme", "Voice"], 0, null, "Tone reflects feeling.");
    // VOCAB
    addQ("Synonym for ASSUAGE:", ["Conciliate", "Provoke", "Worsen", "Ignore"], 0, null, "Assuage = pacify, conciliate.");
    addQ("Best synonym for HACKNEYED:", ["Trite", "Fresh", "Original", "Complex"], 0, null, "Overused, cliché.");
    addQ("HIATUS means:", ["A gap or break", "Continuation", "Unity", "Conclusion"], 0, null, "Pause in activity.");
    addQ("TRANSCEND means:", ["Go beyond limits", "Stay within", "Descend", "Copy"], 0, null, "Exceed, surpass.");
    // GRAMMAR
    addQ("Correct punctuation: 'Its a beautiful day lets go'", ["It's a beautiful day; let's go.", "Its a beautiful day, lets go.", "It's a beautiful day lets go.", "Its' a beautiful day; let's go."], 0, null, "Semicolon + contraction.");
    addQ("Subject-verb agreement: 'The group of students ____ studying.'", ["is", "are", "am", "be"], 0, null, "Collective noun singular.");
    addQ("Correct use of colon:", ["I need: apples, milk.", "I need the following: apples, milk.", "I need apples: milk.", "I need, apples milk."], 1, null, "Complete sentence before colon.");
    // COLD READS
    addQ("Passage: 'free, free, free!' - The Story of an Hour inference:", ["Liberation feeling", "Deep mourning", "Anger", "Confusion"], 0, "She whispered 'free' after husband's death.", "Mrs. Mallard envisions independence.");
    addQ("'The Raven' allusion to Pallas suggests:", ["Seeking wisdom", "Love", "Death", "War"], 0, null, "Wisdom goddess, ironic torment.");
    addQ("'The Yellow Wallpaper' woman behind pattern symbolizes:", ["Desire for freedom", "Madness is fake", "Domestic bliss", "Revenge"], 0, null, "Narrator's trapped self.");
    // extra
    addQ("Author of 'The Raven' and 'Masque'?", ["Edgar Allan Poe", "Hawthorne", "Melville", "Dickinson"], 0, null, "Poe, master of Gothic.");
    addQ("Modernism feature:", ["Stream of consciousness", "Heroic couplets", "Pastoral", "Didactic"], 0, null, "Fragmentation after WWI.");
    addQ("'A Rose for Emily' rose symbolizes:", ["Love & pity", "Death", "Anger", "Wealth"], 0, null, "Respect and sorrow.");
    addQ("Who wrote 'Nature' and 'Self-Reliance'?", ["Ralph Waldo Emerson", "Thoreau", "Whitman", "Longfellow"], 0, null, "Emerson, transcendentalist.");
    addQ("Dramatic irony definition:", ["Audience knows more", "Sarcasm", "Unexpected twist", "Understatement"], 0, null, "Character unaware, audience aware.");
    // total > 55 unique -> great coverage
    console.log("Bank size:", MASTER_QUESTIONS.length);
    
    // ---------- GAME STATE & MODES ----------
    let currentGameQuestions = [];
    let currentIndex = 0, playerScore = 0, playerLives = 3, streak = 0;
    let activeTimer = null, answeringLock = false, gameActive = true;
    let currentMode = "classic";   // classic, endurance, blitz
    let timeLimit = 16;
    let currentTimeLeft = 16;
    let hintsRemaining = 2;
    let skipsRemaining = 1;
    
    // DOM elements
    const questionDiv = document.getElementById("questionText");
    const optionsDiv = document.getElementById("optionsArea");
    const passageDiv = document.getElementById("passageDisplay");
    const feedbackSpan = document.getElementById("feedbackMsg");
    const nextArea = document.getElementById("nextButtonArea");
    const scoreSpan = document.getElementById("scoreValue");
    const livesSpan = document.getElementById("livesValue");
    const streakSpan = document.getElementById("streakValue");
    const qIndexSpan = document.getElementById("qIndex");
    const qTotalSpan = document.getElementById("qTotal");
    const timerFill = document.getElementById("timerFill");
    const timerZoneDiv = document.getElementById("timerZone");
    const hintCountSpan = document.getElementById("hintCount");
    const skipCountSpan = document.getElementById("skipCount");
    const hintBtn = document.getElementById("hintBtn");
    const skipBtn = document.getElementById("skipBtn");
    
    function updateUI() {
        scoreSpan.innerText = playerScore;
        livesSpan.innerText = playerLives;
        streakSpan.innerText = streak;
        qIndexSpan.innerText = currentIndex + 1;
        qTotalSpan.innerText = currentGameQuestions.length;
        hintCountSpan.innerText = hintsRemaining;
        skipCountSpan.innerText = skipsRemaining;
    }
    
    function stopTimer() { if (activeTimer) clearInterval(activeTimer); activeTimer = null; }
    
    function startTimer() {
        if (!gameActive) return;
        if (currentMode === "endurance") { timerZoneDiv.style.display = "none"; return; }
        else timerZoneDiv.style.display = "block";
        if (activeTimer) stopTimer();
        let maxTime = (currentMode === "blitz") ? 10 : 16;
        timeLimit = maxTime;
        currentTimeLeft = timeLimit;
        timerFill.style.width = "100%";
        activeTimer = setInterval(() => {
            if (!gameActive || answeringLock) return;
            if (currentTimeLeft <= 0) {
                if (!answeringLock) handleTimeout();
            } else {
                currentTimeLeft--;
                let percent = (currentTimeLeft / timeLimit) * 100;
                timerFill.style.width = `${Math.max(0, percent)}%`;
                timerFill.style.background = currentTimeLeft <= 3 ? "#ff5555" : "linear-gradient(90deg, #0ff, #f0f)";
            }
        }, 1000);
    }
    
    function handleTimeout() {
        if (answeringLock) return;
        answeringLock = true;
        stopTimer();
        playerLives--;
        streak = 0;
        updateUI();
        const q = currentGameQuestions[currentIndex];
        feedbackSpan.innerHTML = `⏰ TIME'S UP! Correct: ${q.options[q.correctIdx]} — ${q.explanation || "Review"}`;
        highlightCorrectAnswer(true);
        if (playerLives <= 0) endGame();
        else showNextButton();
    }
    
    function highlightCorrectAnswer(disableAll = true) {
        const btns = document.querySelectorAll(".option-btn");
        const correct = currentGameQuestions[currentIndex].correctIdx;
        btns.forEach((btn, idx) => {
            if (idx === correct) btn.classList.add("correct-flash");
            if (disableAll) btn.disabled = true;
        });
    }
    
    function endGame() {
        gameActive = false;
        answeringLock = true;
        stopTimer();
        feedbackSpan.innerHTML = `💀 GAME OVER 💀 Final Score: ${playerScore}. Restart to master Honors English III!`;
        feedbackSpan.style.color = "#ff8888";
        nextArea.style.display = "none";
        optionsDiv.innerHTML = '<div style="color:#ffb347; text-align:center;">🏁 Gauntlet over — restart for another run 🏁</div>';
    }
    
    function showNextButton() { nextArea.style.display = "flex"; }
    
    function createParticles(x, y) {
        for (let i=0;i<12;i++) {
            let particle = document.createElement("div");
            particle.className = "particle";
            particle.style.left = (x + (Math.random() - 0.5)*40) + "px";
            particle.style.top = (y + (Math.random() - 0.5)*40) + "px";
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 600);
        }
    }
    
    function handleAnswer(selectedIdx) {
        if (answeringLock || !gameActive) return;
        answeringLock = true;
        stopTimer();
        const q = currentGameQuestions[currentIndex];
        const isCorrect = (selectedIdx === q.correctIdx);
        const btns = document.querySelectorAll(".option-btn");
        if (isCorrect) {
            let basePoints = (currentMode === "blitz") ? 200 : 100;
            let streakBonus = streak * 15;
            let totalPoints = basePoints + streakBonus;
            playerScore += totalPoints;
            streak++;
            feedbackSpan.innerHTML = `✅ CORRECT! +${totalPoints} (streak ${streak}) ${q.explanation ? "📖 " + q.explanation : ""}`;
            feedbackSpan.style.color = "#b6ffb0";
            btns[selectedIdx].classList.add("correct-flash");
            const rect = btns[selectedIdx].getBoundingClientRect();
            createParticles(rect.left + rect.width/2, rect.top + rect.height/2);
        } else {
            playerLives--;
            streak = 0;
            feedbackSpan.innerHTML = `❌ WRONG! Correct: ${q.options[q.correctIdx]}. ${q.explanation || "Study more!"}`;
            feedbackSpan.style.color = "#ffb090";
            btns[selectedIdx].classList.add("wrong-shake");
            setTimeout(() => btns[selectedIdx].classList.remove("wrong-shake"), 300);
            if (playerLives <= 0) { updateUI(); endGame(); return; }
        }
        updateUI();
        highlightCorrectAnswer(true);
        if (gameActive && playerLives > 0) showNextButton();
        else if (playerLives <= 0) endGame();
    }
    
    function useHint() {
        if (!gameActive || answeringLock) return;
        if (hintsRemaining <= 0) { feedbackSpan.innerHTML = "⚠️ No hints left! ⚠️"; return; }
        const q = currentGameQuestions[currentIndex];
        const correct = q.correctIdx;
        const wrongIndices = [0,1,2,3].filter(i => i !== correct);
        const toDisable = wrongIndices.slice(0, 1);
        const btns = document.querySelectorAll(".option-btn");
        toDisable.forEach(idx => {
            if(btns[idx]) btns[idx].style.opacity = "0.5";
            btns[idx].disabled = true;
        });
        hintsRemaining--;
        updateUI();
        feedbackSpan.innerHTML = "💡 Hint used: one wrong answer eliminated!";
        setTimeout(() => feedbackSpan.innerHTML = "", 1200);
    }
    
    function useSkip() {
        if (!gameActive || answeringLock) return;
        if (skipsRemaining <= 0) { feedbackSpan.innerHTML = "No skips left!"; return; }
        if (currentIndex + 1 >= currentGameQuestions.length && playerLives > 0) { feedbackSpan.innerHTML = "Last question cannot be skipped!"; return; }
        stopTimer();
        answeringLock = true;
        skipsRemaining--;
        updateUI();
        feedbackSpan.innerHTML = "⏩ Skipped! Moving to next question (no penalty).";
        // skip without penalty, move forward
        currentIndex++;
        if (currentIndex >= currentGameQuestions.length && playerLives > 0) {
            gameActive = false;
            feedbackSpan.innerHTML = `🏆 VICTORY! You conquered the gauntlet! Score: ${playerScore}`;
            optionsDiv.innerHTML = "<div style='text-align:center'>🌟 MASTER OF LITERATURE 🌟</div>";
            nextArea.style.display = "none";
            return;
        }
        answeringLock = false;
        loadQuestion();
    }
    
    function loadQuestion() {
        answeringLock = false;
        nextArea.style.display = "none";
        feedbackSpan.innerHTML = "";
        if (!gameActive) return;
        if (currentIndex >= currentGameQuestions.length) {
            gameActive = false;
            stopTimer();
            feedbackSpan.innerHTML = `🎉 VICTORY! FINAL SCORE: ${playerScore} 🎉 You mastered Honors English III!`;
            optionsDiv.innerHTML = '<div style="text-align:center;">📚 LITERARY CHAMPION 📚<br>Restart to play again</div>';
            nextArea.style.display = "none";
            return;
        }
        const q = currentGameQuestions[currentIndex];
        questionDiv.innerText = q.question;
        if (q.passage) { passageDiv.style.display = "block"; passageDiv.innerText = q.passage; }
        else passageDiv.style.display = "none";
        optionsDiv.innerHTML = "";
        q.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerHTML = `<span style="background:cyan; width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:black;">${String.fromCharCode(65+idx)}</span> ${opt}`;
            btn.addEventListener("click", (e) => handleAnswer(idx));
            optionsDiv.appendChild(btn);
        });
        startTimer();
    }
    
    function nextQuestion() {
        if (!gameActive) return;
        if (answeringLock) {
            currentIndex++;
            if (currentIndex < currentGameQuestions.length && playerLives > 0) loadQuestion();
            else if (currentIndex >= currentGameQuestions.length && playerLives > 0) {
                gameActive = false;
                feedbackSpan.innerHTML = `🏆 TRIUMPH! SCORE: ${playerScore} — literary genius!`;
            }
        }
    }
    
    function restartGame() {
        stopTimer();
        // shuffle questions
        currentGameQuestions = [...MASTER_QUESTIONS];
        for (let i=currentGameQuestions.length-1;i>0;i--) {
            const j = Math.floor(Math.random()*(i+1));
            [currentGameQuestions[i], currentGameQuestions[j]] = [currentGameQuestions[j], currentGameQuestions[i]];
        }
        currentIndex = 0;
        playerScore = 0;
        streak = 0;
        gameActive = true;
        answeringLock = false;
        // set lives & timer based on mode
        if (currentMode === "classic") { playerLives = 3; timeLimit = 16; }
        else if (currentMode === "endurance") { playerLives = 6; timeLimit = 99; timerZoneDiv.style.display = "none"; }
        else if (currentMode === "blitz") { playerLives = 2; timeLimit = 10; }
        hintsRemaining = 2;
        skipsRemaining = 1;
        updateUI();
        loadQuestion();
    }
    
    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll(".mode-btn").forEach(btn => {
            if(btn.dataset.mode === mode) btn.classList.add("active");
            else btn.classList.remove("active");
        });
        restartGame();
    }
    
    // Event binding
    document.getElementById("nextBtn").addEventListener("click", nextQuestion);
    document.getElementById("restartGameBtn").addEventListener("click", () => restartGame());
    hintBtn.addEventListener("click", useHint);
    skipBtn.addEventListener("click", useSkip);
    document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.addEventListener("click", (e) => setMode(btn.dataset.mode));
    });
    
    // initial classic start
    restartGame();
</script>
</body>
</html>
